[project]
name = "pursuit"
version = "1.00.0"
requires-python = ">=3.10"
description = "Cops-and-robbers pursuit engine"
dependencies = [
    "anthropic>=0.121.0",
    "fastmcp>=3.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursuit"]

[tool.ruff]
line-length = 100
target-version = "py310"
# scratchpad/ holds throwaway measurement scripts, is gitignored, and never
# ships. Their numbers live in the docs and commit messages, not in the repo.
# extend-exclude, NOT exclude: plain `exclude` REPLACES ruff's built-in list
# (.venv, __pycache__, .git, ...), which is masked inside a git checkout because
# ruff also honours .gitignore, but bites the moment the tree is linted outside
# one -- e.g. a source archive, where it tried to lint the whole virtualenv.
extend-exclude = ["scratchpad", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src", "training"]
omit = ["*/main.py", "*/gui/*", "tests/*"]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
